name: Multi-Platform Artifact Matrix (Desktop & Mobile)

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as official GitHub Release'
        required: false
        default: false
        type: boolean
      target_channel:
        description: 'Target Distribution Channel'
        required: true
        default: 'all-platforms'
        type: choice
        options:
          - all-platforms
          - mobile-only
          - desktop-only

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. MOBILE BUILD MATRIX: ANDROID (APK + AAB)
  # =========================================================================
  build_android:
    name: "🤖 Mobile: Android (APK & AAB)"
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Android Release APK & App Bundle (AAB)
        run: ./gradlew assembleRelease bundleRelease --stacktrace --no-daemon

      - name: Prepare Android Artifacts & Checksums
        run: |
          mkdir -p dist/android
          cp app/build/outputs/apk/debug/*.apk dist/android/sect-idle-debug.apk || true
          cp app/build/outputs/apk/release/*.apk dist/android/sect-idle-release.apk || true
          cp app/build/outputs/bundle/release/*.aab dist/android/sect-idle-release.aab || true
          cd dist/android
          sha256sum * > SHA256SUMS-ANDROID.txt
          cat SHA256SUMS-ANDROID.txt
          cd ../..

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-android-mobile
          path: dist/android/
          retention-days: 30

  # =========================================================================
  # 2. MOBILE BUILD MATRIX: iOS (SIMULATOR IPA & FRAMEWORK)
  # =========================================================================
  build_ios:
    name: "🍏 Mobile: iOS (Simulator & Bridge Bundle)"
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Make Packager Executable
        run: chmod +x scripts/package-mobile-ios.sh

      - name: Build iOS Mobile Package
        run: ./scripts/package-mobile-ios.sh

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-ios-mobile
          path: |
            build/dist/sect-idle-ios-simulator.ipa
            build/dist/sect-idle-ios-simulator.ipa.sha256
          retention-days: 30

  # =========================================================================
  # 3. DESKTOP BUILD MATRIX: LINUX (x64 / ARM64 STANDALONE)
  # =========================================================================
  build_linux:
    name: "🐧 Desktop: Linux (x64 Tarball & Desktop Entry)"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Packager Executable
        run: chmod +x scripts/package-desktop-linux.sh

      - name: Build Linux Standalone Bundle
        run: ./scripts/package-desktop-linux.sh

      - name: Upload Linux Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-desktop-linux-x64
          path: |
            build/dist/sect-idle-linux-x64.tar.gz
            build/dist/sect-idle-linux-x64.tar.gz.sha256
          retention-days: 30

  # =========================================================================
  # 4. DESKTOP BUILD MATRIX: WINDOWS (x64 PORTABLE ZIP & BAT LAUNCHER)
  # =========================================================================
  build_windows:
    name: "🪟 Desktop: Windows (x64 Portable Package)"
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Windows Distribution
        shell: cmd
        run: call scripts\package-desktop-windows.bat

      - name: Compress Windows Artifacts
        shell: pwsh
        run: |
          Compress-Archive -Path "build\dist\windows-x64\*" -DestinationPath "build\dist\sect-idle-windows-x64.zip" -Force
          $Hash = (Get-FileHash -Path "build\dist\sect-idle-windows-x64.zip" -Algorithm SHA256).Hash
          "$Hash  sect-idle-windows-x64.zip" | Out-File -FilePath "build\dist\sect-idle-windows-x64.zip.sha256" -Encoding utf8

      - name: Upload Windows Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-desktop-windows-x64
          path: |
            build/dist/sect-idle-windows-x64.zip
            build/dist/sect-idle-windows-x64.zip.sha256
          retention-days: 30

  # =========================================================================
  # 5. DESKTOP BUILD MATRIX: macOS (UNIVERSAL APPLE SILICON & INTEL)
  # =========================================================================
  build_macos:
    name: "🍎 Desktop: macOS (Universal .app & Tarball)"
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Packager Executable
        run: chmod +x scripts/package-desktop-macos.sh

      - name: Build macOS Universal App Bundle
        run: ./scripts/package-desktop-macos.sh

      - name: Upload macOS Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-desktop-macos-universal
          path: |
            build/dist/macos-universal/sect-idle-macos-universal.tar.gz
            build/dist/macos-universal/sect-idle-macos-universal.tar.gz.sha256
          retention-days: 30

  # =========================================================================
  # 6. UNIFIED MULTI-PLATFORM RELEASE & MANIFEST DISTRIBUTION
  # =========================================================================
  publish_multiplatform_release:
    name: "🌐 Multi-Platform Release Publisher"
    runs-on: ubuntu-latest
    needs: [build_android, build_ios, build_linux, build_windows, build_macos]
    if: always()

    steps:
      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-dist/

      - name: Aggregate Artifacts and Build Unified Checksum Matrix
        run: |
          mkdir -p release-bundle
          find all-dist -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.zip" -o -name "*.tar.gz" -o -name "*.ipa" -o -name "*.sha256" -o -name "SHA256SUMS-ANDROID.txt" \) -exec cp {} release-bundle/ \;
          
          cd release-bundle
          sha256sum *.apk *.aab *.zip *.tar.gz *.ipa 2>/dev/null > SHA256SUMS-ALL-PLATFORMS.txt || true
          cat SHA256SUMS-ALL-PLATFORMS.txt
          cd ..

      - name: Generate Multi-Platform Release Summary Table
        run: |
          echo "## 🌌 Xianxia Immortal Sect Idle — Multi-Platform Build Matrix" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Target OS / Architecture | Output Artifact | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| 🤖 **Mobile (Android)** | ARM64, ARMv7, x86_64 | \`sect-idle-release.apk\`, \`sect-idle-release.aab\` | ✅ Built |" >> $GITHUB_STEP_SUMMARY
          echo "| 🍏 **Mobile (iOS)** | iOS 14+ / Simulator & Bridge | \`sect-idle-ios-simulator.ipa\` | ✅ Built |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐧 **Desktop (Linux)** | Linux x64 / Debian / RHEL / Arch | \`sect-idle-linux-x64.tar.gz\` | ✅ Built |" >> $GITHUB_STEP_SUMMARY
          echo "| 🪟 **Desktop (Windows)** | Windows 10/11 x64 Portable | \`sect-idle-windows-x64.zip\` | ✅ Built |" >> $GITHUB_STEP_SUMMARY
          echo "| 🍎 **Desktop (macOS)** | Universal (M1-M4 & Intel x64) | \`sect-idle-macos-universal.tar.gz\` | ✅ Built |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚡ All multi-platform artifacts packaged, cryptographically hashed, and uploaded." >> $GITHUB_STEP_SUMMARY

      - name: Publish GitHub Release for Tags / Manual Trigger
        uses: softprops/action-gh-release@v2
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true)
        with:
          files: |
            release-bundle/*
          name: "Sect Idle Multi-Platform Release ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            ## 🌸 Xianxia Immortal Sect Idle — Multi-Platform Release
            
            Multi-platform packages for Mobile (Android/iOS) and Desktop (Windows/Linux/macOS).
            
            ### 📱 Mobile Distributions
            - **Android Universal APK**: `sect-idle-release.apk`
            - **Android App Bundle (Google Play Store)**: `sect-idle-release.aab`
            - **iOS Simulator / Bridge**: `sect-idle-ios-simulator.ipa`
            
            ### 💻 Desktop Distributions
            - **Windows x64**: `sect-idle-windows-x64.zip` (Includes Batch & PowerShell Launchers)
            - **Linux x64**: `sect-idle-linux-x64.tar.gz` (Includes Desktop Entry & Executable Script)
            - **macOS Universal**: `sect-idle-macos-universal.tar.gz` (Apple Silicon & Intel)
            
            ### 🔐 Cryptographic Checksums
            See `SHA256SUMS-ALL-PLATFORMS.txt` for integrity verification.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
